<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>Cuckoo 遥控</title>
<style>
:root{
  --bg:#0d1117;
  --surface:#161b22;
  --inset:#0a0e14;
  --border:#21262d;
  --border-strong:#30363d;
  --text:#e6edf3;
  --text-2:#8b949e;
  --text-3:#6e7681;
  --accent:#4c8dff;
  --accent-dim:rgba(76,141,255,.14);
  --ok:#3fb950;
  --err:#f85149;
  --warn:#d29922;
  --r-sm:6px;
  --r-md:10px;
  --r-lg:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  display:flex;flex-direction:column;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  font-size:14px;
  line-height:1.6;
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
  -webkit-font-smoothing:antialiased;
}

/* ===== 顶栏 ===== */
header{
  display:flex;align-items:center;gap:10px;
  padding:11px 16px;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
  background:var(--bg);
}
.mark{
  width:20px;height:20px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  color:var(--accent);
}
.mark svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.brand{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.brand .name{font-size:13.5px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.brand .sub{font-size:11px;color:var(--text-3);line-height:1.2;font-variant-numeric:tabular-nums}
.conn{
  display:flex;align-items:center;gap:6px;
  font-size:11.5px;color:var(--text-2);
  padding:4px 9px;border:1px solid var(--border);
  border-radius:20px;white-space:nowrap;
}
.dot{width:6px;height:6px;border-radius:50%;background:var(--text-3);flex-shrink:0}
.conn.on .dot{background:var(--ok);box-shadow:0 0 6px rgba(63,185,80,.6)}
.conn.busy .dot{background:var(--accent);box-shadow:0 0 6px rgba(76,141,255,.7);animation:pulse 1.2s ease-in-out infinite}
.conn.off .dot{background:var(--err)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ===== 消息流 ===== */
#chat{flex:1;overflow-y:auto;padding:8px 16px 12px;display:flex;flex-direction:column}
#chat::-webkit-scrollbar{width:3px}
#chat::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:3px}

.empty{
  margin-top:56px;text-align:left;
  padding:0 4px;
  font-size:13px;color:var(--text-2);line-height:1.75;
}
.empty .t{font-weight:600;color:var(--text);margin-bottom:6px;font-size:14px}
.empty .s{color:var(--text-3);font-size:12.5px}

.row-msg{
  display:flex;flex-direction:column;
  padding:11px 0;
  border-bottom:1px solid var(--border);
}
.row-msg:last-child{border-bottom:none}
.tag{
  display:flex;align-items:center;gap:7px;
  font-size:11px;color:var(--text-3);
  text-transform:uppercase;letter-spacing:.07em;
  margin-bottom:5px;font-weight:600;
}
.tag svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.body{font-size:14px;line-height:1.7;white-space:pre-wrap;word-break:break-word;color:var(--text)}

/* AI 消息：终端风格，左侧强调细线 */
.row-msg.ai .body{border-left:2px solid var(--border-strong);padding-left:11px}
.row-msg.ai .tag{color:var(--accent)}
.row-msg.ai .tag svg{color:var(--accent)}

/* 用户消息：右对齐，实底卡片，不渐变 */
.row-msg.user{align-items:flex-end}
.row-msg.user .tag{color:var(--text-2)}
.row-msg.user .body{
  background:var(--surface);border:1px solid var(--border-strong);
  border-radius:var(--r-md);padding:8px 12px;max-width:88%;
  color:var(--text);
}

/* 工具调用：等宽、小字、状态色 */
.row-msg.tool .tag{letter-spacing:.04em}
.row-msg.tool .body{
  font-family:ui-monospace,"SF Mono",Consolas,monospace;
  font-size:12px;line-height:1.65;color:var(--text-2);
  background:var(--inset);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:7px 10px;
  white-space:pre-wrap;word-break:break-all;
}
.row-msg.tool.run .tag{color:var(--warn)}
.row-msg.tool.ok .tag{color:var(--ok)}
.row-msg.tool.err .tag{color:var(--err)}

/* 思考：折叠，虚线 */
.think{
  padding:9px 0;
  border-bottom:1px solid var(--border);
}
.think .head{
  display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none;
  font-size:11px;font-weight:600;color:var(--text-3);
  text-transform:uppercase;letter-spacing:.07em;
}
.think .head svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.think .chev{margin-left:auto;transition:transform .15s;color:var(--text-3)}
.think.open .chev{transform:rotate(90deg)}
.think .content{
  display:none;margin-top:7px;
  font-size:12.5px;line-height:1.7;color:var(--text-2);
  border-left:2px solid var(--border);padding-left:11px;
  white-space:pre-wrap;word-break:break-word;
}
.think.open .content{display:block}

/* 系统提示行 */
.sys{
  padding:10px 0;display:flex;align-items:center;gap:8px;
  font-size:12px;color:var(--text-3);
  border-bottom:1px solid var(--border);
}
.sys svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.sys.ok{color:var(--ok)}
.sys.err{color:var(--err)}

/* ===== 底部操作区 ===== */
.dock{
  flex-shrink:0;
  border-top:1px solid var(--border);
  background:var(--bg);
  padding:10px 16px 12px;
  display:flex;flex-direction:column;gap:9px;
}
.quick{display:flex;gap:6px}
.qi{
  flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
  padding:8px 4px;
  font-size:12px;font-weight:500;
  color:var(--text-2);
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r-sm);
  cursor:pointer;
  transition:border-color .15s,color .15s,background .15s;
}
.qi:active{background:var(--border)}
.qi:hover{border-color:var(--border-strong);color:var(--text)}
.qi svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.qi.warn:hover{color:var(--err);border-color:rgba(248,81,73,.4)}
.compose{display:flex;gap:8px;align-items:stretch}
.input-wrap{
  flex:1;min-width:0;position:relative;display:flex;align-items:center;
  background:var(--inset);
  border:1px solid var(--border-strong);
  border-radius:var(--r-md);
  transition:border-color .15s,box-shadow .15s;
}
.input-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
.input-wrap textarea{
  flex:1;min-width:0;resize:none;
  padding:10px 12px;
  font-size:15px;line-height:1.5;
  font-family:inherit;
  color:var(--text);
  background:transparent;border:none;outline:none;
  max-height:120px;
}
.input-wrap textarea::placeholder{color:var(--text-3)}
.send{
  flex-shrink:0;width:42px;
  display:flex;align-items:center;justify-content:center;
  background:var(--accent);color:#fff;
  border:none;border-radius:var(--r-md);
  cursor:pointer;transition:filter .15s,transform .1s;
}
.send:active{transform:scale(.96)}
.send:hover{filter:brightness(1.1)}
.send:disabled{opacity:.4;cursor:not-allowed}
.send svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ===== 命令面板（抽屉） ===== */
.scrim{
  position:fixed;inset:0;background:rgba(0,0,0,.55);
  opacity:0;pointer-events:none;transition:opacity .2s;z-index:100;
}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:101;
  max-height:78vh;
  background:var(--surface);
  border-top:1px solid var(--border-strong);
  border-radius:var(--r-lg) var(--r-lg) 0 0;
  transform:translateY(100%);
  transition:transform .24s cubic-bezier(.32,.72,0,1);
  display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom);
}
.sheet.show{transform:translateY(0)}
.grip{width:36px;height:4px;background:var(--border-strong);border-radius:2px;margin:9px auto 4px;flex-shrink:0}
.sheet-head{
  display:flex;align-items:center;
  padding:6px 18px 12px;flex-shrink:0;
}
.sheet-head .title{font-size:15px;font-weight:600;flex:1}
.x{
  width:30px;height:30px;display:flex;align-items:center;justify-content:center;
  color:var(--text-2);cursor:pointer;border-radius:var(--r-sm);
}
.x:hover{background:var(--border)}
.x svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sheet-body{overflow-y:auto;padding:0 18px 20px}

.sec{margin-bottom:20px}
.sec-t{
  font-size:11px;font-weight:600;color:var(--text-3);
  text-transform:uppercase;letter-spacing:.08em;
  margin-bottom:8px;
}
.opt{
  display:flex;align-items:center;gap:11px;
  padding:11px 12px;margin-bottom:5px;
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:var(--r-md);
  cursor:pointer;
  transition:border-color .15s,background .15s;
}
.opt:hover{border-color:var(--border-strong)}
.opt.cur{border-color:var(--accent);background:var(--accent-dim)}
.opt .ic{width:18px;height:18px;flex-shrink:0;color:var(--text-2);display:flex;align-items:center;justify-content:center}
.opt .ic svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.opt .txt{flex:1;min-width:0}
.opt .t1{font-size:13.5px;font-weight:500;color:var(--text);line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt .t2{font-size:11.5px;color:var(--text-3);line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt .mark-badge{font-size:10px;color:var(--accent);font-weight:600;letter-spacing:.04em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.gbtn{
  display:flex;align-items:center;gap:9px;
  padding:12px 13px;
  background:var(--bg);border:1px solid var(--border);border-radius:var(--r-md);
  color:var(--text);font-size:13px;font-weight:500;
  cursor:pointer;transition:border-color .15s,background .15s;
}
.gbtn:hover{border-color:var(--border-strong);background:var(--surface)}
.gbtn:active{background:var(--border)}
.gbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;color:var(--text-2)}
.hint{font-size:12px;color:var(--text-3);padding:8px 2px;line-height:1.6}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--border-strong);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<header>
  <div class="mark"><svg viewBox="0 0 24 24"><path d="M12 2 4 6v6c0 5 3.5 9 8 10 4.5-1 8-5 8-10V6z"/><path d="m9 12 2 2 4-4"/></svg></div>
  <div class="brand">
    <div class="name">Cuckoo 遥控</div>
    <div class="sub" id="sub">正在连接…</div>
  </div>
  <div class="conn off" id="conn"><span class="dot"></span><span id="conn-t">离线</span></div>
</header>

<div id="chat"></div>

<div class="dock">
  <div class="quick">
    <button class="qi warn" id="q-stop">
      <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>停止
    </button>
    <button class="qi" id="q-new">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>新对话
    </button>
    <button class="qi" id="q-menu">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>控制
    </button>
  </div>
  <div class="compose">
    <div class="input-wrap">
      <textarea id="input" rows="1" placeholder="给 AI 发消息…"></textarea>
    </div>
    <button class="send" id="send" disabled>
      <svg viewBox="0 0 24 24"><path d="m5 12 7-7 7 7M12 5v14"/></svg>
    </button>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet">
  <div class="grip"></div>
  <div class="sheet-head">
    <div class="title">控制面板</div>
    <div class="x" id="sheet-x"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></div>
  </div>
  <div class="sheet-body">
    <div class="sec">
      <div class="sec-t">导航</div>
      <div class="grid2">
        <button class="gbtn" data-nav="back"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>后退</button>
        <button class="gbtn" data-nav="forward"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>前进</button>
        <button class="gbtn" data-nav="reload"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>刷新</button>
        <button class="gbtn" data-nav="home"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/></svg>首页</button>
      </div>
    </div>

    <div class="sec">
      <div class="sec-t">当前状态</div>
      <div id="cur-status"><div class="hint">加载中…</div></div>
    </div>

    <div class="sec">
      <div class="sec-t">窗口</div>
      <div id="win-list"><div class="hint">加载中…</div></div>
    </div>

    <div class="sec">
      <div class="sec-t">会话</div>
      <div id="sess-list"><div class="hint">加载中…</div></div>
    </div>
  </div>
</div>

<script>
(function(){
  var ws=null, currentBubble=null, currentThink=null, lastAiText='';
  var toolRows={}, stoppedRetry=false;
  var $chat=document.getElementById('chat');
  var $input=document.getElementById('input');
  var $send=document.getElementById('send');
  var $conn=document.getElementById('conn');
  var $connT=document.getElementById('conn-t');
  var $sub=document.getElementById('sub');
  var $scrim=document.getElementById('scrim');
  var $sheet=document.getElementById('sheet');

  // ===== 图标 =====
  var I={
    ai:'<svg viewBox="0 0 24 24"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2M20 14h2M15 13v2M9 13v2"/></svg>',
    user:'<svg viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
    tool:'<svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.6 5.6L4 17v3h3l5.1-5.1a4 4 0 0 0 5.6-5.6l-2.5 2.5-2.1-2.1z"/></svg>',
    think:'<svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-4 12.7V17a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.3A7 7 0 0 0 12 2z"/><path d="M9 21h6"/></svg>',
    ok:'<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>',
    err:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>',
    link:'<svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>',
    off:'<svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>',
    win:'<svg viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/></svg>',
    chat:'<svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
    chev:'<svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>'
  };

  function setConn(state,text){
    $conn.className='conn '+state;
    $connT.textContent=text;
  }
  function setSub(text){ $sub.textContent=text||''; }
  function scrollBottom(){ $chat.scrollTop=$chat.scrollHeight; }
  function emptyHint(){
    var d=document.createElement('div');
    d.className='empty';d.id='empty';
    d.innerHTML='<div class="t">还没有对话</div><div class="s">在下面输入框发消息，或点「控制」选会话。</div>';
    $chat.appendChild(d);
  }
  function clearEmpty(){ var e=document.getElementById('empty'); if(e&&e.parentNode)e.parentNode.removeChild(e); }
  function mkRow(kind,icon,tagText){
    clearEmpty();
    var r=document.createElement('div');
    r.className='row-msg '+kind;
    var tag=document.createElement('div');
    tag.className='tag';
    tag.innerHTML=(icon||'')+'<span>'+(tagText||'')+'</span>';
    var body=document.createElement('div');
    body.className='body';
    r.appendChild(tag);r.appendChild(body);
    $chat.appendChild(r);
    return {row:r,body:body};
  }
  function aiText(text){
    if(!currentBubble){ var o=mkRow('ai',I.ai,'Cuckoo'); currentBubble=o.body; }
    currentBubble.textContent=text; scrollBottom();
  }

  // ===== WebSocket =====
  function connect(){
    if(stoppedRetry) return;
    var proto=location.protocol==='https:'?'wss://':'ws://';
    setConn('off','连接中');
    ws=new WebSocket(proto+location.host+'/ws');
    ws.onopen=function(){
      setConn('on','在线'); $send.disabled=false;
      sysLine('ok',I.link,'已连接到电脑');
      send({type:'status'});
    };
    ws.onclose=function(e){
      $send.disabled=true;
      if(e&&e.code===4001){ stoppedRetry=true; setConn('off','未授权'); sysLine('err',I.off,'未授权，请刷新重新登录'); return; }
      setConn('off','断开'); currentBubble=null;
      sysLine('err',I.off,'连接断开，2 秒后重连…');
      setTimeout(connect,2000);
    };
    ws.onerror=function(){ setConn('off','错误'); };
    ws.onmessage=function(e){ var m;try{m=JSON.parse(e.data);}catch(_){return;} handle(m); };
  }
  function send(o){ if(!ws||ws.readyState!==1)return false; ws.send(JSON.stringify(o)); return true; }
  function sysLine(kind,icon,text){
    clearEmpty();
    var d=document.createElement('div');
    d.className='sys '+kind;
    d.innerHTML=(icon||'')+'<span></span>';
    d.querySelector('span:last-child').textContent=text;
    $chat.appendChild(d); scrollBottom();
  }

  // ===== 事件处理 =====
  function handle(msg){
    var t=msg.type;
    if(t==='stream'){
      var think=String(msg.think||'').trim();
      if(think){
        if(!currentThink){ currentThink=mkThink(); }
        currentThink.content.textContent=think;
        scrollBottom();
      } else if(currentThink){ currentThink.row.classList.remove('open'); }
      aiText(msg.text||'');
    } else if(t==='assistant-done'){
      var dt=String(msg.text||'').trim();
      if(dt){ if(currentBubble){currentBubble.textContent=dt;} else if(dt!==lastAiText){ aiText(dt); } lastAiText=dt; }
      currentBubble=null; currentThink=null;
    } else if(t==='tool-start'){
      var code=String(msg.code||'');
      var first=code.split(String.fromCharCode(10))[0].slice(0,70);
      var o=mkRow('tool run',I.tool,'运行');
      o.body.textContent=first;
      toolRows[code]=o;
    } else if(t==='tool-end'){
      var o2=toolRows[msg.code];
      if(o2){
        if(msg.success){ o2.row.className='row-msg tool ok'; o2.row.querySelector('.tag').innerHTML=I.ok+'<span>完成</span>'; o2.body.textContent=firstLine(msg.code); }
        else{ o2.row.className='row-msg tool err'; o2.row.querySelector('.tag').innerHTML=I.err+'<span>失败</span>'; o2.body.textContent=(msg.error||'执行失败'); }
        delete toolRows[msg.code];
      }
    } else if(t==='task-idle'){
      currentBubble=null;currentThink=null;
      setConn('on','在线');
    } else if(t==='ai-state'){
      if(msg.generating) setConn('busy','生成中'); else setConn('on','在线');
    } else if(t==='ack'){
      handleAck(msg);
    } else if(t==='unauthorized'){
      stoppedRetry=true; setConn('off','未授权');
    } else if(t==='error'){
      sysLine('err',I.err,msg.error||'错误');
    }
  }
  function firstLine(code){ return String(code||'').split(String.fromCharCode(10))[0].slice(0,70); }
  function mkThink(){
    clearEmpty();
    var r=document.createElement('div'); r.className='think open';
    var h=document.createElement('div'); h.className='head';
    h.innerHTML=I.think+'<span>思考过程</span><span class="chev">'+I.chev+'</span>';
    var c=document.createElement('div'); c.className='content';
    h.onclick=function(){ r.classList.toggle('open'); };
    r.appendChild(h);r.appendChild(c);
    $chat.appendChild(r); scrollBottom();
    return {row:r,content:c};
  }

  function handleAck(msg){
    var ft=msg.forType, d=msg.data||{};
    if(ft==='status'&&d.success){
      setSub(d.providerId+(d.projectDir?' · 项目已选':''));
      renderStatus(d);
    } else if(ft==='new'){ sysLine('ok',I.ok,'已开新对话'); }
    else if(ft==='stop'){ sysLine('',I.ok,'已请求停止'); }
    else if(ft==='windows'){ renderWindows(d); }
    else if(ft==='sessions'){ renderSessions(d); }
    else if(ft==='switch-session'){ if(d.success){sysLine('ok',I.ok,'已切换会话');closeSheet();} else sysLine('err',I.err,d.error||'切换失败'); }
    else if(ft==='switch-window'){ if(d.success){sysLine('ok',I.ok,'已切换窗口');send({type:'status'});} }
    else if(ft==='back'||ft==='forward'||ft==='reload'||ft==='home'){ if(d.success) closeSheet(); }
    else if(ft==='new-for-project'){ if(d.success){sysLine('ok',I.ok,'已新建对话');closeSheet();} }
  }

  // ===== 控制面板渲染 =====
  function renderStatus(d){
    var el=document.getElementById('cur-status');
    if(!el) return;
    el.innerHTML='';
    el.appendChild(optRow(I.win,'平台',d.providerId||'未识别',false,function(){}));
    el.appendChild(optRow(I.chat,'会话',d.sessionId||'新会话',false,function(){}));
  }
  function optRow(icon,t1,t2,cur,onclick){
    var d=document.createElement('div');
    d.className='opt'+(cur?' cur':'');
    d.innerHTML='<div class="ic">'+icon+'</div><div class="txt"><div class="t1"></div><div class="t2"></div></div>'+(cur?'<span class="mark-badge">当前</span>':'');
    d.querySelector('.t1').textContent=t1;
    d.querySelector('.t2').textContent=t2;
    if(onclick) d.onclick=onclick;
    return d;
  }
  function renderWindows(d){
    var el=document.getElementById('win-list');
    if(!el) return;
    el.innerHTML='';
    if(!d.success||!d.windows||!d.windows.length){ el.innerHTML='<div class="hint">无窗口</div>'; return; }
    d.windows.forEach(function(w){
      var t1=(w.providerId||'窗口')+(w.isSubagent?'（子代理）':'');
      var t2='ID '+w.id;
      el.appendChild(optRow(I.win,t1,t2,w.isMain,function(){
        if(!w.isMain) send({type:'switch-window',windowId:w.id});
      }));
    });
  }
  function renderSessions(d){
    var el=document.getElementById('sess-list');
    if(!el) return;
    el.innerHTML='';
    if(!d.success||!d.sessions||!d.sessions.length){ el.innerHTML='<div class="hint">没有会话记录</div>'; return; }
    // 最近更新的在前
    var list=d.sessions.slice().sort(function(a,b){ return (b.updatedAt||0)-(a.updatedAt||0); }).slice(0,30);
    list.forEach(function(s){
      var cur=s.sessionId===d.currentSessionId;
      var title=s.title||'(无标题)';
      var proj=(s.projectDir||'').split(/[\\/]/).pop()||'';
      el.appendChild(optRow(I.chat,title,proj,cur,function(){
        if(!cur) send({type:'switch-session',sessionId:s.sessionId});
      }));
    });
  }

  // ===== 抽屉 =====
  function openSheet(){
    $scrim.classList.add('show'); $sheet.classList.add('show');
    send({type:'status'}); send({type:'windows'}); send({type:'sessions'});
  }
  function closeSheet(){ $scrim.classList.remove('show'); $sheet.classList.remove('show'); }

  // ===== 输入 =====
  function submit(){
    var v=$input.value.trim();
    if(!v) return;
    if(!send({type:'send',text:v})){ sysLine('err',I.err,'未连接'); return; }
    var o=mkRow('user',I.user,'你'); o.body.textContent=v;
    $input.value=''; autoGrow();
    currentBubble=null;currentThink=null;lastAiText='';
  }
  function autoGrow(){ $input.style.height='auto'; $input.style.height=Math.min($input.scrollHeight,120)+'px'; }

  $send.onclick=submit;
  $input.addEventListener('input',autoGrow);
  $input.addEventListener('keydown',function(e){
    if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); submit(); }
  });
  document.getElementById('q-stop').onclick=function(){ send({type:'stop'}); };
  document.getElementById('q-new').onclick=function(){ send({type:'new'}); };
  document.getElementById('q-menu').onclick=openSheet;
  document.getElementById('sheet-x').onclick=closeSheet;
  $scrim.onclick=closeSheet;
  document.querySelectorAll('[data-nav]').forEach(function(b){
    b.onclick=function(){ send({type:b.getAttribute('data-nav')}); };
  });

  emptyHint();
  connect();
})();
</script>
</body>
</html>
