<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Cuckoo</title>
<style>
:root{
  --bg:#ffffff; --bg-elev:#fbfbfd;
  --surface:#f5f6f8; --surface-hover:#eef0f4;
  --border:rgba(16,24,40,.07); --border-strong:rgba(16,24,40,.12); --border-soft:rgba(16,24,40,.05);
  --text:#16181d; --text-2:#545a67; --text-dim:#8a8f9b;
  --accent:#4d6bfe; --accent-soft:rgba(77,107,254,.08);
  --green:#30a46c; --red:#e5484d; --amber:#b07d2b; --amber-soft:rgba(176,125,43,.10);
  --user-bg:#eef0f4; --code-bg:#f5f6f8;
  --shadow:rgba(16,24,40,.12);
  --mono:"SFMono-Regular","SF Mono","Cascadia Code",Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#16181d; --bg-elev:#191c22;
    --surface:rgba(255,255,255,.045); --surface-hover:rgba(255,255,255,.08);
    --border:rgba(255,255,255,.08); --border-strong:rgba(255,255,255,.14); --border-soft:rgba(255,255,255,.05);
    --text:#e4e6eb; --text-2:#a8adba; --text-dim:#757b8a;
    --accent:#6b83ff; --accent-soft:rgba(107,131,255,.16);
    --green:#46b47e; --red:#ff6369; --amber:#d9a05b; --amber-soft:rgba(217,160,91,.08);
    --user-bg:rgba(255,255,255,.08); --code-bg:rgba(0,0,0,.35);
    --shadow:rgba(0,0,0,.45);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  display:flex;flex-direction:column;
  background:var(--bg);color:var(--text);
  font-family:var(--sans);font-size:14px;line-height:1.65;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
svg{display:block}

/* ===== 顶栏 ===== */
.topbar{
  flex-shrink:0;height:44px;display:flex;align-items:center;gap:6px;
  padding:0 8px;padding-top:env(safe-area-inset-top);
  min-height:calc(44px + env(safe-area-inset-top));
  border-bottom:1px solid var(--border-soft);
  background:var(--bg);
}
.tb-btn{
  width:36px;height:36px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  border-radius:8px;color:var(--text-2);transition:background .14s;
}
.tb-btn:active{background:var(--surface)}
.tb-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tb-mid{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:0}
.tb-mid .t1{font-size:13px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.01em}
.tb-mid .t2{font-size:10.5px;color:var(--text-dim);display:flex;align-items:center;gap:5px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--text-dim);flex-shrink:0}
.dot.on{background:var(--green)}
.dot.busy{background:var(--amber);animation:pulse 1.2s infinite}
.dot.off{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ===== 流 ===== */
.stream{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 0 4px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.stream::-webkit-scrollbar{width:0}

.empty{text-align:center;color:var(--text-dim);padding:20vh 24px 0;font-size:13px;line-height:1.9}
.empty .glyph{margin-bottom:14px;color:var(--accent);display:flex;justify-content:center}
.empty .glyph svg{width:38px;height:38px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.empty .t1{color:var(--text-2);font-size:14px;font-weight:600;margin-bottom:4px}
.empty .t2{font-size:12px}

.msg{margin-bottom:16px;animation:fade .16s ease}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

/* 用户：右对齐气泡 */
.msg.user{display:flex;justify-content:flex-end}
.msg.user .bubble{
  max-width:82%;background:var(--user-bg);color:var(--text);
  padding:9px 13px;border-radius:10px;border:1px solid var(--border-soft);
  white-space:pre-wrap;word-break:break-word;line-height:1.6;
}

/* 助手：左对齐无气泡 + 前缀 */
.msg.assistant .prefix{
  display:flex;align-items:center;gap:7px;
  font-size:11px;font-weight:600;color:var(--accent);letter-spacing:.4px;margin-bottom:7px;
}
.msg.assistant .prefix svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.msg.assistant .body{font-size:14px;line-height:1.75;color:var(--text);word-break:break-word;white-space:pre-wrap}
.streaming-cursor{
  display:inline-block;width:7px;height:15px;margin-left:2px;background:var(--accent);
  vertical-align:text-bottom;animation:blink 1s step-end infinite;
}
@keyframes blink{50%{opacity:0}}

.msg.system{display:flex;justify-content:center}
.msg.system .sys-text{font-size:12px;color:var(--amber);padding:4px 12px;background:var(--amber-soft);border-radius:6px}
.msg.system.err .sys-text{color:var(--red);background:var(--accent-soft)}
.msg.system.ok .sys-text{color:var(--green);background:var(--accent-soft)}

/* 思考块 */
.think{margin-bottom:10px;border-left:2px solid var(--border);background:var(--surface);border-radius:0 6px 6px 0}
.think-head{
  display:flex;align-items:center;gap:7px;padding:6px 12px;
  cursor:pointer;user-select:none;font-size:11.5px;color:var(--text-dim);
}
.think-head svg{width:11px;height:11px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
.think.open .think-head svg.caret{transform:rotate(90deg)}
.think-body{
  display:none;padding:2px 12px 10px 12px;
  font-size:12.5px;line-height:1.7;color:var(--text-dim);
  white-space:pre-wrap;word-break:break-word;
}
.think.open .think-body{display:block}

/* 工具卡片 */
.tool{margin-bottom:12px}
.tool-card{border:1px solid var(--border-soft);border-radius:8px;background:var(--bg-elev);overflow:hidden}
.tool-head{display:flex;align-items:center;gap:9px;padding:9px 12px;cursor:pointer;user-select:none}
.tool-head:active{background:var(--surface)}
.tool-icon{width:14px;height:14px;flex-shrink:0;color:var(--text-dim);display:flex}
.tool-icon svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tool-name{font-size:12px;font-weight:600;color:var(--text-2);font-family:var(--mono);flex-shrink:0}
.tool-arg{flex:1;font-size:12px;color:var(--text-dim);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tool-badge{font-size:10px;padding:1.5px 6px;border-radius:4px;font-weight:600;flex-shrink:0}
.tool-badge.run{background:var(--amber-soft);color:var(--amber)}
.tool-badge.ok{background:var(--accent-soft);color:var(--green)}
.tool-badge.err{background:var(--accent-soft);color:var(--red)}
.tool-caret{color:var(--text-dim);flex-shrink:0;display:flex}
.tool-caret svg{width:9px;height:9px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
.tool-card.open .tool-caret svg{transform:rotate(90deg)}
.tool-body{display:none;border-top:1px solid var(--border-soft);padding:10px 12px}
.tool-card.open .tool-body{display:block}
.tool-pre{
  background:var(--code-bg);border-radius:9px;padding:10px 12px;margin:0;overflow:auto;max-height:300px;
  font-family:var(--mono);font-size:11.5px;line-height:1.6;color:var(--text-2);
  white-space:pre-wrap;word-break:break-word;
}

/* ===== 输入区 ===== */
.composer{flex-shrink:0;padding:10px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bg)}
.composer-inner{
  max-width:720px;margin:0 auto;
  display:flex;align-items:flex-end;gap:8px;
  background:var(--bg-elev);border:1px solid var(--border);
  border-radius:12px;padding:8px 8px 8px 14px;
  transition:border-color .15s,box-shadow .15s;
}
.composer-inner:focus-within{border-color:var(--border-strong);box-shadow:0 0 0 3px var(--surface-hover)}
#input{
  flex:1;border:none;outline:none;background:transparent;resize:none;
  color:var(--text);font-family:inherit;font-size:15px;line-height:1.6;
  max-height:140px;padding:4px 0;
}
#input::placeholder{color:var(--text-dim)}
#send{
  flex-shrink:0;width:32px;height:32px;border-radius:8px;border:none;
  background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;
  transition:filter .15s,transform .1s;
}
#send:active{transform:scale(.94)}
#send:disabled{background:var(--surface);color:var(--text-dim)}
#send.stop{background:var(--surface);color:var(--red)}
#send svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* ===== 抽屉 ===== */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90;opacity:0;pointer-events:none;transition:opacity .22s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;left:0;bottom:0;z-index:91;width:82%;max-width:330px;
  background:var(--bg-elev);border-right:1px solid var(--border);
  transform:translateX(-100%);transition:transform .25s cubic-bezier(.32,.72,0,1);
  display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
}
.drawer.open{transform:translateX(0)}
.drawer-h{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:14px 14px 10px}
.drawer-h .brand{flex:1;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:650;letter-spacing:-.01em}
.drawer-h .brand svg{width:18px;height:18px;stroke:var(--accent);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.new-btn{
  display:flex;align-items:center;justify-content:center;gap:7px;
  margin:2px 12px 10px;padding:10px;border-radius:10px;
  background:var(--accent);color:#fff;font-size:13.5px;font-weight:600;
  transition:filter .15s;
}
.new-btn:active{filter:brightness(.95)}
.new-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.drawer-scroll{flex:1;overflow-y:auto;padding:0 8px 16px}
.drawer-scroll::-webkit-scrollbar{width:0}
.group-t{font-size:11px;font-weight:600;color:var(--text-dim);letter-spacing:.08em;padding:12px 10px 6px}
.sess{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:9px;cursor:pointer;transition:background .13s}
.sess:active{background:var(--surface)}
.sess.cur{background:var(--accent-soft)}
.sess .ic{width:16px;flex-shrink:0;color:var(--text-dim);display:flex}
.sess.cur .ic{color:var(--accent)}
.sess .ic svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sess .s1{flex:1;min-width:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctrl-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 4px}
.cbtn{
  display:flex;align-items:center;gap:8px;padding:11px 12px;border-radius:9px;
  background:var(--surface);font-size:12.5px;color:var(--text);
}
.cbtn:active{background:var(--surface-hover)}
.cbtn svg{width:15px;height:15px;stroke:var(--text-2);fill:none;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round}
.cbtn.warn svg{stroke:var(--red)}
.hint{padding:8px 12px;font-size:12px;color:var(--text-dim);line-height:1.6}
.skel{height:38px;margin:4px 4px 6px;border-radius:9px;background:linear-gradient(90deg,var(--surface),var(--bg-elev),var(--surface));background-size:200% 100%;animation:sk 1.3s infinite}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body>

<div class="scrim" id="scrim"></div>

<aside class="drawer" id="drawer">
  <div class="drawer-h">
    <div class="brand">
      <svg viewBox="0 0 24 24"><path d="M12 2 4 6v6c0 5 3.5 9 8 10 4.5-1 8-5 8-10V6z"/><path d="m9 12 2 2 4-4"/></svg>
      Cuckoo
    </div>
    <button class="tb-btn" id="drawer-x"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <button class="new-btn" id="new-sess"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>新对话</button>
  <div class="drawer-scroll">
    <div class="group-t">官网会话</div>
    <div id="web-list"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
    <div class="group-t">控制</div>
    <div class="ctrl-grid">
      <button class="cbtn warn" data-cmd="stop"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>停止</button>
      <button class="cbtn" data-cmd="new"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>新对话</button>
      <button class="cbtn" data-cmd="back"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>后退</button>
      <button class="cbtn" data-cmd="forward"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>前进</button>
      <button class="cbtn" data-cmd="reload"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>刷新</button>
      <button class="cbtn" data-cmd="home"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/></svg>首页</button>
    </div>
    <div class="hint" id="device-info"></div>
  </div>
</aside>

<header class="topbar">
  <button class="tb-btn" id="menu"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <div class="tb-mid">
    <div class="t1" id="title">Cuckoo</div>
    <div class="t2"><span class="dot off" id="dot"></span><span id="stat">连接中…</span></div>
  </div>
  <button class="tb-btn" id="refresh"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
</header>

<main class="stream" id="stream">
  <div class="wrap" id="wrap">
    <div class="empty" id="empty">
      <div class="glyph"><svg viewBox="0 0 24 24"><path d="M12 2 4 6v6c0 5 3.5 9 8 10 4.5-1 8-5 8-10V6z"/><path d="m9 12 2 2 4-4"/></svg></div>
      <div class="t1">Cuckoo</div>
      <div class="t2">在下面输入，遥控电脑上的 AI</div>
    </div>
  </div>
</main>

<footer class="composer">
  <div class="composer-inner">
    <textarea id="input" rows="1" placeholder="给 Cuckoo 发消息…"></textarea>
    <button id="send" disabled><svg viewBox="0 0 24 24"><path d="m5 12 7-7 7 7M12 5v14"/></svg></button>
  </div>
</footer>

<script>
(function(){
  var ws=null, curAi=null, curThink=null, curTurn=null, toolMap={}, retry=false, busy=false, lastAi='';
  var $wrap=document.getElementById('wrap');
  var $stream=document.getElementById('stream');
  var $input=document.getElementById('input');
  var $send=document.getElementById('send');
  var $dot=document.getElementById('dot');
  var $stat=document.getElementById('stat');
  var $title=document.getElementById('title');
  var $drawer=document.getElementById('drawer');
  var $scrim=document.getElementById('scrim');
  var $empty=document.getElementById('empty');

  var IC={
    ai:'<svg viewBox="0 0 24 24"><path d="M12 2 4 6v6c0 5 3.5 9 8 10 4.5-1 8-5 8-10V6z"/><path d="m9 12 2 2 4-4"/></svg>',
    tool:'<svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.6 5.6L4 17v3h3l5.1-5.1a4 4 0 0 0 5.6-5.6l-2.5 2.5-2.1-2.1z"/></svg>',
    chev:'<svg class="caret" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>',
    chat:'<svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
    caret:'<svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>'
  };

  function setConn(cls,txt){ $dot.className='dot '+cls; $stat.textContent=txt; }
  function atBottom(){ return $stream.scrollHeight-$stream.scrollTop-$stream.clientHeight<80; }
  function toBottom(){ $stream.scrollTop=$stream.scrollHeight; }
  function rmEmpty(){ if($empty&&$empty.parentNode){$empty.parentNode.removeChild($empty);$empty=null;} }
  function add(el){ rmEmpty(); $wrap.appendChild(el); if(atBottom()) toBottom(); return el; }
  function firstLine(s){ return String(s||'').split(String.fromCharCode(10))[0].slice(0,60); }
  function baseName(p){ if(!p)return ''; return String(p).split(/[\\/]/).filter(Boolean).pop()||''; }

  function sysMsg(cls,text){
    var d=document.createElement('div'); d.className='msg system'+(cls?' '+cls:'');
    var s=document.createElement('div'); s.className='sys-text'; s.textContent=text;
    d.appendChild(s); add(d); return d;
  }
  function userMsg(text){
    var d=document.createElement('div'); d.className='msg user';
    var b=document.createElement('div'); b.className='bubble'; b.textContent=text;
    d.appendChild(b); add(d);
  }
  function getTurn(){ if(!curTurn){ curTurn=document.createElement('div'); curTurn.className='msg assistant'; } return curTurn; }
  function ensureAi(){
    var t=getTurn();
    if(!t.__mounted){ add(t); t.__mounted=true; }
    if(!t.querySelector('.body')){
      var p=document.createElement('div'); p.className='prefix'; p.innerHTML=IC.ai+'<span>Cuckoo</span>';
      var b=document.createElement('div'); b.className='body';
      t.appendChild(p); t.appendChild(b);
      curAi=b;
    }
    return curAi;
  }
  function thinkBlock(){
    var t=getTurn();
    if(!t.__mounted){ add(t); t.__mounted=true; }
    var w=document.createElement('div'); w.className='think open';
    var h=document.createElement('div'); h.className='think-head'; h.innerHTML=IC.chev+'<span>思考中…</span>';
    var b=document.createElement('div'); b.className='think-body';
    h.onclick=function(){ w.classList.toggle('open'); };
    w.appendChild(h); w.appendChild(b);
    // 思考块插到 body 之前（若已有）
    var body=t.querySelector('.body');
    if(body&&body.parentNode) t.insertBefore(w,body.parentNode===t?body:t.firstChild); else t.appendChild(w);
    return {wrap:w,body:b};
  }
  function toolCard(code){
    var t=getTurn();
    if(!t.__mounted){ add(t); t.__mounted=true; }
    var w=document.createElement('div'); w.className='tool';
    var card=document.createElement('div'); card.className='tool-card';
    var h=document.createElement('div'); h.className='tool-head';
    h.innerHTML='<span class="tool-icon">'+IC.tool+'</span><span class="tool-name">工具</span><span class="tool-arg"></span><span class="tool-badge run">运行中</span><span class="tool-caret">'+IC.caret+'</span>';
    h.querySelector('.tool-arg').textContent=firstLine(code);
    var b=document.createElement('div'); b.className='tool-body';
    var pre=document.createElement('pre'); pre.className='tool-pre'; pre.textContent=code||'';
    b.appendChild(pre);
    h.onclick=function(){ card.classList.toggle('open'); };
    card.appendChild(h); card.appendChild(b); w.appendChild(card);
    // 工具卡插到 body 之前
    var body=t.querySelector('.body');
    if(body&&body.parentNode) t.insertBefore(w,body); else t.appendChild(w);
    return {wrap:w,card:card,badge:h.querySelector('.tool-badge'),pre:pre};
  }

  function handle(m){
    var t=m.type;
    if(t==='stream'){
      var tk=String(m.think||'').trim();
      if(tk){ if(!curThink) curThink=thinkBlock(); curThink.body.textContent=tk; }
      else if(curThink){ curThink.wrap.classList.remove('open'); }
      var tx=m.text||'';
      var b=ensureAi(); b.textContent=tx;
      if(atBottom()) toBottom();
    }
    else if(t==='assistant-done'){
      var dt=String(m.text||'').trim();
      if(dt){ var b2=ensureAi(); b2.textContent=dt; lastAi=dt; }
      curAi=null; curThink=null;
    }
    else if(t==='tool-start'){
      if(curThink){ curThink.wrap.classList.remove('open'); }
      var el=toolCard(m.code||'');
      if(m.code) toolMap[m.code]=el;
      curAi=null;
    }
    else if(t==='tool-end'){
      var e2=toolMap[m.code];
      if(e2){
        if(m.success){ e2.badge.className='tool-badge ok'; e2.badge.textContent='完成'; }
        else{ e2.badge.className='tool-badge err'; e2.badge.textContent='失败'; if(m.error) e2.pre.textContent=String(m.code||'')+String.fromCharCode(10,10)+'错误：'+m.error; }
        delete toolMap[m.code];
      }
      curAi=null; curThink=null;
    }
    else if(t==='task-idle'){ curAi=null; curThink=null; curTurn=null; setBusy(false); }
    else if(t==='ai-state'){ setBusy(!!m.generating); }
    else if(t==='ack'){ handleAck(m); }
    else if(t==='unauthorized'){ retry=true; setConn('off','未授权'); sysMsg('err','未授权，请刷新重新登录'); }
    else if(t==='error'){ sysMsg('err',m.error||'出错了'); }
  }

  function handleAck(m){
    var ft=m.forType, d=m.data||{};
    if(ft==='status'&&d.success){
      var sub=[]; if(d.providerId)sub.push(d.providerId); if(d.projectDir)sub.push(baseName(d.projectDir));
      $title.textContent=sub.join(' · ')||'Cuckoo';
      document.getElementById('device-info').textContent=(d.providerId||'')+(d.projectDir?(' · '+d.projectDir):'');
    }
    else if(ft==='web-sessions'){ renderWebSessions(d); }
    else if(ft==='new'){ sysMsg('ok','已开新对话'); closeDrawer(); curTurn=null; }
    else if(ft==='stop'){ sysMsg('','已请求停止'); }
    else if(ft==='navigate-url'){ if(d.success){closeDrawer(); curTurn=null; curAi=null; curThink=null;} }
    else if(ft==='back'||ft==='forward'||ft==='reload'||ft==='home'){ if(d.success){closeDrawer(); curTurn=null;} }
  }

  function renderWebSessions(d){
    var el=document.getElementById('web-list'); el.innerHTML='';
    var list=d.sessions||[];
    if(!list.length){ el.innerHTML='<div class="hint">官网暂无会话（或当前平台不支持读取）</div>'; return; }
    list.slice(0,50).forEach(function(s){
      var row=document.createElement('div');
      row.className='sess'+(s.active?' cur':'');
      row.innerHTML='<span class="ic">'+IC.chat+'</span><span class="s1"></span>';
      row.querySelector('.s1').textContent=s.title||'(无标题)';
      row.onclick=function(){ if(s.href) send({type:'navigate-url',url:s.href}); };
      el.appendChild(row);
    });
  }

  function connect(){
    if(retry) return;
    var proto=location.protocol==='https:'?'wss://':'ws://';
    setConn('off','连接中…');
    ws=new WebSocket(proto+location.host+'/ws');
    ws.onopen=function(){
      setConn('on','在线'); $send.disabled=false;
      sysMsg('ok','已连接到电脑');
      send({type:'status'});
    };
    ws.onclose=function(e){
      $send.disabled=true; setBusy(false);
      if(e&&e.code===4001){ retry=true; setConn('off','未授权'); sysMsg('err','未授权，请刷新重新登录'); return; }
      setConn('off','断开'); curAi=null;
      sysMsg('err','连接断开，2 秒后重连…');
      setTimeout(connect,2000);
    };
    ws.onerror=function(){ setConn('off','错误'); };
    ws.onmessage=function(e){ var m;try{m=JSON.parse(e.data);}catch(_){return;} handle(m); };
  }
  function send(o){ if(!ws||ws.readyState!==1)return false; ws.send(JSON.stringify(o)); return true; }

  function setBusy(on){
    busy=on;
    $send.disabled=!ws||ws.readyState!==1;
    if(on){
      setConn('busy','生成中'); $send.className='stop';
      $send.innerHTML='<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
    } else {
      setConn('on','在线'); $send.className='';
      $send.innerHTML='<svg viewBox="0 0 24 24"><path d="m5 12 7-7 7 7M12 5v14"/></svg>';
    }
  }

  function grow(){ $input.style.height='auto'; $input.style.height=Math.min($input.scrollHeight,140)+'px'; }
  function submit(){
    if(busy){ send({type:'stop'}); return; }
    var v=$input.value.trim(); if(!v)return;
    if(!send({type:'send',text:v})){ sysMsg('err','未连接'); return; }
    curTurn=null; curAi=null; curThink=null; lastAi='';
    userMsg(v); toBottom();
    $input.value=''; grow();
  }
  $send.onclick=submit;
  $input.addEventListener('input',grow);
  $input.addEventListener('keydown',function(e){ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submit();} });

  function openDrawer(){ $drawer.classList.add('open'); $scrim.classList.add('open'); send({type:'web-sessions'}); send({type:'status'}); }
  function closeDrawer(){ $drawer.classList.remove('open'); $scrim.classList.remove('open'); }
  document.getElementById('menu').onclick=openDrawer;
  document.getElementById('drawer-x').onclick=closeDrawer;
  $scrim.onclick=closeDrawer;
  document.getElementById('new-sess').onclick=function(){ send({type:'new'}); };
  document.querySelectorAll('[data-cmd]').forEach(function(b){ b.onclick=function(){ send({type:b.getAttribute('data-cmd')}); }; });
  document.getElementById('refresh').onclick=function(){ send({type:'web-sessions'}); toBottom(); };

  connect();
})();
</script>
</body>
</html>
