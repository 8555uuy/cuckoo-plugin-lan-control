<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>局域网控制</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  display:flex;flex-direction:column;
  background:radial-gradient(1200px 600px at 20% 0%,#1e293b,#0b1220 60%);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  color:#e2e8f0;
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
}
header{
  display:flex;align-items:center;gap:10px;
  padding:12px 16px;
  border-bottom:1px solid rgba(148,163,184,.12);
  flex-shrink:0;
}
.logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#38bdf8,#6366f1);display:flex;align-items:center;justify-content:center}
.logo svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.title{font-size:14px;font-weight:600;flex:1}
.badge{font-size:11px;font-weight:500;padding:3px 10px;border-radius:20px;white-space:nowrap}
.badge.on{background:rgba(52,211,153,.14);color:#34d399}
.badge.off{background:rgba(107,116,130,.16);color:#94a3b8}
.badge.err{background:rgba(248,113,113,.14);color:#f87171}
#chat{flex:1;overflow-y:auto;padding:14px 14px 6px;display:flex;flex-direction:column;gap:10px}
.empty{text-align:center;font-size:12.5px;color:#64748b;padding:40px 20px;line-height:1.6}
.msg{max-width:92%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,#38bdf8,#6366f1);color:#fff;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:rgba(30,41,59,.8);border:1px solid rgba(148,163,184,.14);border-bottom-left-radius:4px}
.msg.tool{align-self:flex-start;font-size:12px;color:#94a3b8;background:rgba(15,23,42,.6);border:1px solid rgba(148,163,184,.12);font-family:ui-monospace,Consolas,monospace;max-width:92%;padding:6px 10px;border-radius:8px;white-space:pre-wrap;word-break:break-all}
.msg.tool.ok{color:#86efac;border-color:rgba(134,239,172,.22)}
.msg.tool.err{color:#fca5a5;border-color:rgba(252,165,165,.22)}
.input-bar{flex-shrink:0;padding:10px 14px;border-top:1px solid rgba(148,163,184,.12);display:flex;flex-direction:column;gap:8px;background:rgba(11,18,32,.6);backdrop-filter:blur(10px)}
.row{display:flex;gap:8px}
input[type=text]{flex:1;min-width:0;padding:11px 14px;font-size:15px;color:#e2e8f0;background:rgba(15,23,42,.8);border:1px solid rgba(148,163,184,.2);border-radius:11px;outline:none}
input[type=text]:focus{border-color:#38bdf8;box-shadow:0 0 0 3px rgba(56,189,248,.14)}
input[type=text]::placeholder{color:#64748b}
button{padding:11px 16px;font-size:14px;font-weight:600;color:#fff;background:linear-gradient(135deg,#38bdf8,#6366f1);border:none;border-radius:11px;cursor:pointer;white-space:nowrap;transition:filter .15s,transform .1s}
button:active{transform:scale(.97)}
button:hover{filter:brightness(1.08)}
button.sec{background:transparent;color:#e2e8f0;border:1px solid rgba(148,163,184,.22);font-weight:500}
button.sec:hover{background:rgba(148,163,184,.1)}
button:disabled{opacity:.5;cursor:not-allowed}
.toolbar{display:flex;gap:6px}
.toolbar button{flex:1;font-size:12.5px;padding:8px 10px}
</style>
</head>
<body>
<header>
  <div class="logo"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
  <div class="title">局域网控制</div>
  <div class="badge off" id="status">连接中…</div>
</header>

<div id="chat">
  <div class="empty" id="empty">正在连接到电脑上的 Cuckoo…</div>
</div>

<div class="input-bar">
  <div class="toolbar">
    <button class="sec" id="btn-stop">停止</button>
    <button class="sec" id="btn-new">新对话</button>
    <button class="sec" id="btn-status">状态</button>
  </div>
  <div class="row">
    <input type="text" id="input" placeholder="给 AI 发消息…" autocomplete="off">
    <button id="btn-send">发送</button>
  </div>
</div>

<script>
(function(){
  var ws = null;
  var currentBubble = null;
  var toolBubbles = new Map();
  var stoppedRetry = false;
  var lastAiText = '';
  var $chat = document.getElementById('chat');
  var $input = document.getElementById('input');
  var $status = document.getElementById('status');
  var $empty = document.getElementById('empty');

  function setStatus(text, cls) {
    $status.textContent = text;
    $status.className = 'badge ' + (cls || 'off');
  }
  function clearEmpty() {
    if ($empty && $empty.parentNode) { $empty.parentNode.removeChild($empty); $empty = null; }
  }
  function scrollBottom() { $chat.scrollTop = $chat.scrollHeight; }
  function addBubble(cls, text) {
    clearEmpty();
    var d = document.createElement('div');
    d.className = 'msg ' + cls;
    d.textContent = text || '';
    $chat.appendChild(d);
    scrollBottom();
    return d;
  }

  function connect() {
    if (stoppedRetry) return;
    var proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
    setStatus('连接中…', 'off');
    ws = new WebSocket(proto + location.host + '/ws');
    ws.onopen = function() {
      setStatus('已连接', 'on');
      addBubble('tool ok', '✓ 已连接到电脑');
    };
    ws.onclose = function(e) {
      if (e && e.code === 4001) {
        stoppedRetry = true;
        setStatus('未授权', 'err');
        addBubble('tool err', '✗ 未授权，请重新登录');
        return;
      }
      setStatus('已断开', 'err');
      currentBubble = null;
      addBubble('tool err', '✗ 连接已断开，2 秒后重连…');
      setTimeout(connect, 2000);
    };
    ws.onerror = function() { setStatus('错误', 'err'); };
    ws.onmessage = function(e) {
      var msg;
      try { msg = JSON.parse(e.data); } catch (_) { return; }
      handle(msg);
    };
  }

  function send(obj) {
    if (!ws || ws.readyState !== 1) return false;
    ws.send(JSON.stringify(obj));
    return true;
  }

  function handle(msg) {
    var t = msg && msg.type;
    if (t === 'stream') {
      var text = msg.text || '';
      if (!currentBubble) {
        if (!text) return;
        currentBubble = addBubble('ai', text);
      } else {
        currentBubble.textContent = text;
        scrollBottom();
      }
    } else if (t === 'assistant-done') {
      var doneText = String(msg.text || '').trim();
      if (currentBubble) {
        if (doneText) currentBubble.textContent = doneText;
        currentBubble = null;
        lastAiText = doneText;
      } else if (doneText && doneText !== lastAiText) {
        // 去重：相同内容不重复显示（assistant-done 可能被上报两次）
        addBubble('ai', doneText);
        lastAiText = doneText;
      }
    } else if (t === 'tool-start') {
      var firstLine = String(msg.code || '').split(String.fromCharCode(10))[0].slice(0, 80);
      var b = addBubble('tool', '▸ ' + firstLine);
      if (msg.code) toolBubbles.set(msg.code, b);
    } else if (t === 'tool-end') {
      var b2 = toolBubbles.get(msg.code);
      if (b2) {
        b2.textContent = (msg.success ? '✓ 完成' : '✗ 失败: ' + (msg.error || ''));
        b2.className = 'msg tool ' + (msg.success ? 'ok' : 'err');
        toolBubbles.delete(msg.code);
      }
    } else if (t === 'task-idle') {
      currentBubble = null;
      setStatus('已连接', 'on');
    } else if (t === 'ai-state') {
      setStatus(msg.generating ? '生成中…' : '已连接', msg.generating ? 'on' : 'on');
    } else if (t === 'hello') {
      // 握手完成
    } else if (t === 'ack') {
      if (msg.forType === 'status' && msg.data && msg.data.success) {
        addBubble('tool', '状态: ' + (msg.data.providerId || '?') + ' · ' + (msg.data.projectDir || '无项目'));
      } else if (msg.forType === 'new') {
        addBubble('tool ok', '✓ 已开新对话');
      } else if (msg.forType === 'stop') {
        addBubble('tool', '▸ 已请求停止');
      }
    } else if (t === 'unauthorized') {
      stoppedRetry = true;
      setStatus('未授权', 'err');
      addBubble('tool err', '✗ 未授权，请刷新页面重新登录');
    } else if (t === 'error') {
      addBubble('tool err', '✗ ' + (msg.error || '错误'));
    }
  }

  function submit() {
    var v = $input.value.trim();
    if (!v) return;
    if (!send({ type: 'send', text: v })) { addBubble('tool err', '✗ 未连接'); return; }
    addBubble('user', v);
    $input.value = '';
    currentBubble = null;
    lastAiText = '';
  }

  document.getElementById('btn-send').onclick = submit;
  $input.addEventListener('keydown', function(e) { if (e.key === 'Enter') submit(); });
  document.getElementById('btn-stop').onclick = function() { send({ type: 'stop' }); };
  document.getElementById('btn-new').onclick = function() { send({ type: 'new' }); };
  document.getElementById('btn-status').onclick = function() { send({ type: 'status' }); };

  connect();
})();
</script>
</body>
</html>
