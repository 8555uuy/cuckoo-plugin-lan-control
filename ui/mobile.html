<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#18181a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Cuckoo</title>
<style>
:root{
  --bg:#18181a;
  --bg-2:#1f1f22;
  --bg-3:#28282c;
  --bg-4:#313136;
  --border:#2c2c31;
  --border-2:#3a3a40;
  --text:#ececef;
  --text-2:#9b9ba3;
  --text-3:#67676f;
  --accent:#4c8dff;
  --accent-dim:rgba(76,141,255,.13);
  --ok:#4ade80;
  --err:#f87171;
  --warn:#fbbf24;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  display:flex;flex-direction:column;
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  font-size:14px;line-height:1.6;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
svg{display:block}

/* ===== 顶栏 ===== */
.bar{
  flex-shrink:0;height:52px;
  display:flex;align-items:center;gap:2px;
  padding:0 6px;padding-top:env(safe-area-inset-top);
  min-height:calc(52px + env(safe-area-inset-top));
  border-bottom:1px solid var(--border);
  background:var(--bg);
}
.icon-btn{
  width:40px;height:40px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  border-radius:10px;color:var(--text-2);
  transition:background .15s,color .15s;
}
.icon-btn:active{background:var(--bg-3)}
.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.bar-title{
  flex:1;min-width:0;
  display:flex;flex-direction:column;align-items:center;gap:1px;
}
.bar-title .t1{
  font-size:14px;font-weight:600;letter-spacing:-.01em;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.bar-title .t2{font-size:11px;color:var(--text-3);display:flex;align-items:center;gap:5px}
.conn-dot{width:6px;height:6px;border-radius:50%;background:var(--text-3);flex-shrink:0;transition:background .2s}
.conn-dot.on{background:var(--ok);box-shadow:0 0 7px rgba(74,222,128,.55)}
.conn-dot.busy{background:var(--accent);box-shadow:0 0 7px rgba(76,141,255,.6);animation:pulse 1.1s ease-in-out infinite}
.conn-dot.off{background:var(--err)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ===== 对话流 ===== */
#chat{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:8px 16px 16px;
  scroll-behavior:smooth;
}
#chat::-webkit-scrollbar{width:0}

.welcome{
  padding:56px 4px 0;
}
.welcome .mk{
  width:44px;height:44px;border-radius:12px;
  background:var(--bg-3);display:flex;align-items:center;justify-content:center;
  color:var(--accent);margin-bottom:16px;
}
.welcome .mk svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.welcome h1{font-size:19px;font-weight:650;letter-spacing:-.02em;margin-bottom:6px;line-height:1.3}
.welcome p{font-size:13.5px;color:var(--text-2);line-height:1.65;max-width:34ch}

.turn{padding:12px 0;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.turn + .turn{border-top:1px solid var(--border)}

/* 消息行 */
.line{display:flex;gap:11px;align-items:flex-start}
.line.user{flex-direction:row-reverse}

.avatar{
  width:26px;height:26px;flex-shrink:0;margin-top:1px;
  display:flex;align-items:center;justify-content:center;
  border-radius:8px;background:var(--bg-3);color:var(--text-2);
}
.avatar svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.line.ai .avatar{color:var(--accent)}

.bubble{
  min-width:0;font-size:14.5px;line-height:1.72;
  white-space:pre-wrap;word-break:break-word;
}
.line.ai .bubble{flex:1;padding-top:2px;color:var(--text)}
.line.user .bubble{
  flex:0 1 auto;max-width:82%;
  background:var(--bg-3);
  border-radius:16px 16px 5px 16px;
  padding:9px 14px;color:var(--text);
}
.bubble:empty::after{
  content:'';display:inline-block;width:7px;height:16px;margin-left:1px;
  background:var(--accent);border-radius:1px;vertical-align:-2px;
  animation:blink 1s steps(2) infinite;
}
@keyframes blink{50%{opacity:0}}

/* 思考块 */
.think{margin:9px 0 3px;border-radius:10px;background:var(--bg-2);border:1px solid var(--border);overflow:hidden}
.think-h{
  display:flex;align-items:center;gap:8px;
  padding:8px 12px;font-size:12.5px;color:var(--text-2);
  cursor:pointer;user-select:none;line-height:1.3;
}
.think-h svg{width:13px;height:13px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;color:var(--text-3)}
.think-h .lbl{flex:1}
.think-h .chev{transition:transform .18s;color:var(--text-3)}
.think.open .think-h .chev{transform:rotate(90deg)}
.think-b{
  display:none;padding:0 12px 11px 33px;
  font-size:13px;line-height:1.7;color:var(--text-2);
  white-space:pre-wrap;word-break:break-word;
}
.think.open .think-b{display:block}

/* 工具卡片 */
.tool{
  margin:9px 0 3px;border:1px solid var(--border);border-radius:10px;
  background:var(--bg-2);overflow:hidden;
}
.tool-h{
  display:flex;align-items:center;gap:9px;
  padding:9px 12px;font-size:12.5px;
  cursor:pointer;user-select:none;line-height:1.35;
}
.tool-h svg{width:14px;height:14px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tool-h .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.tool-h .lbl{flex:1;min-width:0;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool-h .st{font-size:11px;font-weight:600;letter-spacing:.02em;flex-shrink:0}
.tool.run .tool-h svg{color:var(--warn)}
.tool.run .dot{background:var(--warn);animation:pulse 1s infinite}
.tool.run .st{color:var(--warn)}
.tool.ok .tool-h svg{color:var(--ok)}
.tool.ok .st{color:var(--ok)}
.tool.err .tool-h svg{color:var(--err)}
.tool.err .st{color:var(--err)}
.tool-b{
  display:none;padding:0 12px 11px;
  font-family:var(--mono);font-size:11.5px;line-height:1.7;color:var(--text-2);
  white-space:pre-wrap;word-break:break-all;
  border-top:1px solid var(--border);padding-top:10px;margin-top:1px;
}
.tool.open .tool-b{display:block}

/* 系统行 */
.sys{
  display:flex;align-items:center;gap:8px;
  padding:9px 0;font-size:12.5px;color:var(--text-3);
  border-bottom:1px solid var(--border);
}
.sys svg{width:14px;height:14px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.sys.ok{color:var(--ok)}
.sys.err{color:var(--err)}

/* ===== 输入区 ===== */
.composer{
  flex-shrink:0;
  padding:10px 12px calc(12px + env(safe-area-inset-bottom));
  border-top:1px solid var(--border);
  background:var(--bg);
}
.cbox{
  display:flex;align-items:flex-end;gap:6px;
  background:var(--bg-2);border:1px solid var(--border-2);
  border-radius:22px;padding:5px 6px 5px 16px;
  transition:border-color .15s,box-shadow .15s;
}
.cbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
#input{
  flex:1;min-width:0;border:none;outline:none;background:transparent;
  color:var(--text);font-size:15.5px;line-height:1.5;
  font-family:inherit;resize:none;
  padding:7px 0;max-height:132px;
}
#input::placeholder{color:var(--text-3)}
.send{
  width:36px;height:36px;flex-shrink:0;border-radius:50%;
  background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;
  transition:filter .15s,transform .1s,background .15s;
}
.send:active{transform:scale(.93)}
.send:disabled{background:var(--bg-4);color:var(--text-3);cursor:default}
.send svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.send.stop{background:var(--bg-4);color:var(--err)}
.send.stop:active{background:#3a2a2a}

/* ===== 抽屉 ===== */
.scrim{
  position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;
  opacity:0;pointer-events:none;transition:opacity .24s;
  backdrop-filter:blur(1px);
}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;left:0;bottom:0;z-index:91;
  width:85%;max-width:360px;
  background:var(--bg-2);border-right:1px solid var(--border-2);
  transform:translateX(-100%);
  transition:transform .26s cubic-bezier(.32,.72,0,1);
  display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
}
.drawer.open{transform:translateX(0)}
.drawer-h{
  flex-shrink:0;display:flex;align-items:center;gap:10px;
  padding:14px 16px 10px;
}
.drawer-h .brand{
  flex:1;display:flex;align-items:center;gap:9px;
  font-size:15px;font-weight:650;letter-spacing:-.01em;
}
.drawer-h .brand .mk{
  width:26px;height:26px;border-radius:8px;background:var(--bg-3);
  display:flex;align-items:center;justify-content:center;color:var(--accent);
}
.drawer-h .brand .mk svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.new-btn{
  display:flex;align-items:center;gap:7px;
  margin:4px 12px 10px;padding:10px 13px;
  background:var(--bg-3);border:1px solid var(--border-2);border-radius:11px;
  font-size:13.5px;font-weight:500;color:var(--text);
  transition:background .15s,border-color .15s;
}
.new-btn:active{background:var(--bg-4)}
.new-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.drawer-scroll{flex:1;overflow-y:auto;padding:0 8px 16px}
.drawer-scroll::-webkit-scrollbar{width:0}
.group-t{
  font-size:11px;font-weight:600;color:var(--text-3);
  text-transform:uppercase;letter-spacing:.09em;
  padding:14px 10px 6px;
}
.sess{
  display:flex;align-items:center;gap:10px;
  padding:10px 11px;border-radius:10px;
  cursor:pointer;transition:background .13s;
}
.sess:active{background:var(--bg-3)}
.sess.cur{background:var(--accent-dim)}
.sess .ic{width:18px;flex-shrink:0;color:var(--text-3);display:flex}
.sess.cur .ic{color:var(--accent)}
.sess .ic svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sess .info{flex:1;min-width:0}
.sess .s1{
  font-size:13.5px;font-weight:500;line-height:1.4;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.sess .s2{
  font-size:11.5px;color:var(--text-3);line-height:1.4;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.ctrl-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 4px}
.cbtn{
  display:flex;align-items:center;gap:9px;
  padding:11px 12px;border-radius:10px;
  background:var(--bg-3);border:1px solid var(--border);
  font-size:13px;color:var(--text);
  transition:background .13s,border-color .13s;
}
.cbtn:active{background:var(--bg-4)}
.cbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round;color:var(--text-2)}
.cbtn.warn svg{color:var(--err)}
.hint{padding:8px 12px;font-size:12px;color:var(--text-3);line-height:1.6}
.skel{height:40px;margin:4px 4px 6px;border-radius:10px;background:linear-gradient(90deg,var(--bg-3),var(--bg-2),var(--bg-3));background-size:200% 100%;animation:sk 1.3s infinite}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body>

<div class="scrim" id="scrim"></div>

<aside class="drawer" id="drawer">
  <div class="drawer-h">
    <div class="brand">
      <span class="mk"><svg viewBox="0 0 24 24"><path d="M12 2 4 6v6c0 5 3.5 9 8 10 4.5-1 8-5 8-10V6z"/><path d="m9 12 2 2 4-4"/></svg></span>
      Cuckoo
    </div>
    <button class="icon-btn" id="drawer-x"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <button class="new-btn" id="new-sess"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>新对话</button>
  <div class="drawer-scroll">
    <div class="group-t">会话</div>
    <div id="sess-list"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
    <div class="group-t">控制</div>
    <div class="ctrl-grid">
      <button class="cbtn warn" data-cmd="stop"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>停止生成</button>
      <button class="cbtn" data-cmd="new"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>新对话</button>
      <button class="cbtn" data-cmd="back"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>后退</button>
      <button class="cbtn" data-cmd="forward"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>前进</button>
      <button class="cbtn" data-cmd="reload"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>刷新页面</button>
      <button class="cbtn" data-cmd="home"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/></svg>回首页</button>
    </div>
    <div class="hint" id="device-info"></div>
  </div>
</aside>

<header class="bar">
  <button class="icon-btn" id="menu"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <div class="bar-title">
    <div class="t1" id="title">Cuckoo</div>
    <div class="t2"><span class="conn-dot off" id="dot"></span><span id="stat">连接中…</span></div>
  </div>
  <button class="icon-btn" id="refresh"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
</header>

<main id="chat"></main>

<footer class="composer">
  <div class="cbox">
    <textarea id="input" rows="1" placeholder="给 Cuckoo 发消息…"></textarea>
    <button class="send" id="send" disabled><svg viewBox="0 0 24 24"><path d="m5 12 7-7 7 7M12 5v14"/></svg></button>
  </div>
</footer>

<script>
(function(){
  var ws=null, curAi=null, curThink=null, curTurn=null, toolMap={}, retry=false, busy=false;
  var lastAi='', curSessionId=null, sessions=[];
  var $chat=document.getElementById('chat');
  var $input=document.getElementById('input');
  var $send=document.getElementById('send');
  var $dot=document.getElementById('dot');
  var $stat=document.getElementById('stat');
  var $title=document.getElementById('title');
  var $drawer=document.getElementById('drawer');
  var $scrim=document.getElementById('scrim');

  var IC={
    ai:'<svg viewBox="0 0 24 24"><path d="M12 2 4 6v6c0 5 3.5 9 8 10 4.5-1 8-5 8-10V6z"/><path d="m9 12 2 2 4-4"/></svg>',
    user:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg>',
    tool:'<svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.6 5.6L4 17v3h3l5.1-5.1a4 4 0 0 0 5.6-5.6l-2.5 2.5-2.1-2.1z"/></svg>',
    think:'<svg viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0-3.6 10.8c.4.3.6.7.6 1.2v1h6v-1c0-.5.2-.9.6-1.2A6 6 0 0 0 12 3z"/><path d="M10 21h4"/></svg>',
    ok:'<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>',
    err:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>',
    link:'<svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>',
    chat:'<svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>'
  };

  function setConn(cls,txt){ $dot.className='conn-dot '+cls; $stat.textContent=txt; }
  function atBottom(){ return $chat.scrollHeight-$chat.scrollTop-$chat.clientHeight < 80; }
  function toBottom(){ $chat.scrollTop=$chat.scrollHeight; }
  function clearWelcome(){ var w=document.querySelector('.welcome'); if(w)w.remove(); }
  function welcome(){
    var d=document.createElement('div'); d.className='welcome';
    d.innerHTML='<div class="mk">'+IC.ai+'</div><h1>Cuckoo</h1><p>远程遥控电脑上的 AI。发消息、看进度、切换会话，都在这里。</p>';
    $chat.appendChild(d);
  }
  function sysLine(cls,icon,txt){
    clearWelcome();
    var d=document.createElement('div'); d.className='sys '+cls;
    d.innerHTML=(icon||'')+'<span></span>';
    d.querySelector('span:last-child').textContent=txt;
    $chat.appendChild(d); toBottom();
  }
  function firstLine(s){ return String(s||'').split(String.fromCharCode(10))[0].slice(0,90); }
  function baseName(p){ if(!p)return ''; return String(p).split(/[\\/]/).filter(Boolean).pop()||''; }

  // ===== 消息构建 =====
  function newTurn(){ clearWelcome(); var d=document.createElement('div'); d.className='turn'; $chat.appendChild(d); return d; }
  /** 取当前轮容器：思考/工具/正文共用，保证同一轮内容在同一 turn 内按序排列 */
  function getTurn(){ if(!curTurn) curTurn=newTurn(); return curTurn; }
  function addAiBubble(text, turn){
    var t=turn||getTurn();
    var line=document.createElement('div'); line.className='line ai';
    var av=document.createElement('div'); av.className='avatar'; av.innerHTML=IC.ai;
    var bb=document.createElement('div'); bb.className='bubble'; bb.textContent=text||'';
    line.appendChild(av); line.appendChild(bb); t.appendChild(line);
    return bb;
  }
  function addUserTurn(text){
    var t=newTurn();
    var line=document.createElement('div'); line.className='line user';
    var av=document.createElement('div'); av.className='avatar'; av.innerHTML=IC.user;
    var bb=document.createElement('div'); bb.className='bubble'; bb.textContent=text||'';
    line.appendChild(av); line.appendChild(bb); t.appendChild(line);
  }

  // ===== 思考 / 工具 =====
  function thinkEl(){
    var w=document.createElement('div'); w.className='think open';
    var h=document.createElement('div'); h.className='think-h';
    h.innerHTML=IC.think+'<span class="lbl">思考中…</span><span class="chev"><svg viewBox="0 0 24 24" style="width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="m9 18 6-6-6-6"/></svg></span>';
    var b=document.createElement('div'); b.className='think-b';
    h.onclick=function(){ w.classList.toggle('open'); };
    w.appendChild(h); w.appendChild(b);
    return {wrap:w,body:b,label:h.querySelector('.lbl')};
  }
  function toolEl(code){
    var w=document.createElement('div'); w.className='tool run';
    var h=document.createElement('div'); h.className='tool-h';
    h.innerHTML=IC.tool+'<span class="dot"></span><span class="lbl"></span><span class="st">运行中</span>';
    h.querySelector('.lbl').textContent=firstLine(code);
    var b=document.createElement('div'); b.className='tool-b'; b.textContent=code||'';
    h.onclick=function(){ w.classList.toggle('open'); };
    w.appendChild(h); w.appendChild(b);
    return {wrap:w,body:b,st:h.querySelector('.st')};
  }

  // ===== 事件处理 =====
  function handle(m){
    var t=m.type;
    if(t==='stream'){
      var tk=String(m.think||'').trim();
      if(tk){
        if(!curThink){ curThink=thinkEl(); getTurn().appendChild(curThink.wrap); }
        curThink.body.textContent=tk;
      } else if(curThink){ curThink.wrap.classList.remove('open'); }
      var tx=m.text||'';
      if(!curAi){ curAi=addAiBubble(tx); }
      else { curAi.textContent=tx; }
      if(atBottom()) toBottom();
    }
    else if(t==='assistant-done'){
      var dt=String(m.text||'').trim();
      if(dt){ if(curAi){ curAi.textContent=dt; } else if(dt!==lastAi){ curAi=addAiBubble(dt); } lastAi=dt; }
      curAi=null; curThink=null;
    }
    else if(t==='tool-start'){
      if(curThink){ curThink.wrap.classList.remove('open'); }
      var el=toolEl(m.code||'');
      getTurn().appendChild(el.wrap);
      if(m.code) toolMap[m.code]=el;
    }
    else if(t==='tool-end'){
      var e2=toolMap[m.code];
      if(e2){
        if(m.success){ e2.wrap.className='tool ok'; e2.st.textContent='完成'; }
        else{ e2.wrap.className='tool err'; e2.st.textContent='失败'; if(m.error) e2.body.textContent=String(m.code||'')+String.fromCharCode(10,10)+'错误：'+m.error; }
        delete toolMap[m.code];
      }
      curAi=null; curThink=null;
    }
    else if(t==='task-idle'){ curAi=null; curThink=null; curTurn=null; setBusy(false); }
    else if(t==='ai-state'){ setBusy(!!m.generating); }
    else if(t==='ack'){ handleAck(m); }
    else if(t==='unauthorized'){ retry=true; setConn('off','未授权'); }
    else if(t==='error'){ sysLine('err',IC.err,m.error||'出错了'); }
  }

  function handleAck(m){
    var ft=m.forType, d=m.data||{};
    if(ft==='status'&&d.success){
      if(d.sessionId) curSessionId=d.sessionId;
      var sub=[];
      if(d.providerId) sub.push(d.providerId);
      if(d.projectDir) sub.push(baseName(d.projectDir));
      $title.textContent=sub.join(' · ')||'Cuckoo';
      document.getElementById('device-info').textContent=(d.providerId||'')+(d.projectDir?(' · '+d.projectDir):'');
    }
    else if(ft==='sessions'){ sessions=d.sessions||[]; renderSessions(d); }
    else if(ft==='new'){ sysLine('ok',IC.ok,'已开新对话'); closeDrawer(); }
    else if(ft==='stop'){ sysLine('',IC.ok,'已请求停止'); }
    else if(ft==='switch-session'){ if(d.success){closeDrawer(); setTimeout(function(){send({type:'status'});},400);} else sysLine('err',IC.err,d.error||'切换失败'); }
    else if(ft==='back'||ft==='forward'||ft==='reload'||ft==='home'){ if(d.success) closeDrawer(); }
  }

  function renderSessions(d){
    var el=document.getElementById('sess-list');
    el.innerHTML='';
    var list=(d.sessions||[]).slice().sort(function(a,b){return (b.updatedAt||0)-(a.updatedAt||0);});
    if(!list.length){ el.innerHTML='<div class="hint">还没有历史会话</div>'; return; }
    list.slice(0,40).forEach(function(s){
      var cur=s.sessionId===d.currentSessionId;
      var row=document.createElement('div');
      row.className='sess'+(cur?' cur':'');
      row.innerHTML='<span class="ic">'+IC.chat+'</span><span class="info"><span class="s1"></span><span class="s2"></span></span>';
      row.querySelector('.s1').textContent=s.title||'(无标题)';
      row.querySelector('.s2').textContent=baseName(s.projectDir)||'未选项目';
      row.onclick=function(){ if(!cur) send({type:'switch-session',sessionId:s.sessionId}); else closeDrawer(); };
      el.appendChild(row);
    });
  }

  // ===== 连接 =====
  function connect(){
    if(retry) return;
    var proto=location.protocol==='https:'?'wss://':'ws://';
    setConn('off','连接中…');
    ws=new WebSocket(proto+location.host+'/ws');
    ws.onopen=function(){
      setConn('on','在线'); $send.disabled=false;
      sysLine('ok',IC.link,'已连接到电脑');
      send({type:'status'}); send({type:'sessions'});
    };
    ws.onclose=function(e){
      $send.disabled=true; setBusy(false);
      if(e&&e.code===4001){ retry=true; setConn('off','未授权'); sysLine('err',IC.err,'未授权，请刷新重新登录'); return; }
      setConn('off','断开'); curAi=null;
      sysLine('err',IC.err,'连接断开，2 秒后重连…');
      setTimeout(connect,2000);
    };
    ws.onerror=function(){ setConn('off','错误'); };
    ws.onmessage=function(e){ var m;try{m=JSON.parse(e.data);}catch(_){return;} handle(m); };
  }
  function send(o){ if(!ws||ws.readyState!==1)return false; ws.send(JSON.stringify(o)); return true; }

  // ===== 忙碌态（发送键变停止）=====
  function setBusy(on){
    busy=on;
    $send.disabled=!ws||ws.readyState!==1;
    if(on){
      setConn('busy','生成中');
      $send.className='send stop';
      $send.innerHTML='<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
    } else {
      setConn('on','在线');
      $send.className='send';
      $send.innerHTML='<svg viewBox="0 0 24 24"><path d="m5 12 7-7 7 7M12 5v14"/></svg>';
    }
  }

  // ===== 输入 =====
  function grow(){ $input.style.height='auto'; $input.style.height=Math.min($input.scrollHeight,132)+'px'; }
  function submit(){
    if(busy){ send({type:'stop'}); return; }
    var v=$input.value.trim(); if(!v) return;
    if(!send({type:'send',text:v})){ sysLine('err',IC.err,'未连接'); return; }
    curTurn=null; curAi=null; curThink=null; lastAi='';
    addUserTurn(v); toBottom();
    $input.value=''; grow();
  }
  $send.onclick=submit;
  $input.addEventListener('input',grow);
  $input.addEventListener('keydown',function(e){ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); submit(); } });

  // ===== 抽屉 =====
  function openDrawer(){ $drawer.classList.add('open'); $scrim.classList.add('open'); send({type:'sessions'}); send({type:'status'}); }
  function closeDrawer(){ $drawer.classList.remove('open'); $scrim.classList.remove('open'); }
  document.getElementById('menu').onclick=openDrawer;
  document.getElementById('drawer-x').onclick=closeDrawer;
  $scrim.onclick=closeDrawer;
  document.getElementById('new-sess').onclick=function(){ send({type:'new'}); };
  document.querySelectorAll('[data-cmd]').forEach(function(b){
    b.onclick=function(){ send({type:b.getAttribute('data-cmd')}); };
  });
  document.getElementById('refresh').onclick=function(){ toBottom(); send({type:'status'}); };

  welcome();
  connect();
})();
</script>
